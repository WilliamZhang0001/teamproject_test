services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: app-mysql
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: devpass
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_ROOT_HOST: '%'
    ports:
      - "53306:3306"
    volumes:
      - ./database/db/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Backend API Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend
    environment:
      - APP_ENV=dev
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=appuser
      - DB_PASS=devpass
      - DB_NAME=appdb
      - JWT_SECRET=change_this_now
      - JWT_EXPIRE_MINUTES=60
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - PARAMETER_SPEC_PATH=/workspace/Parameter_Input_Specification.md
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - ./backend:/app
      - backend-data:/app/data
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --log-level warning

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: app-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - GENERATE_SOURCEMAP=false
      - FAST_REFRESH=true
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
  backend-data:
    driver: local

